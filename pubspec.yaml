name: shopnexus_flutter_app
description: "Cross-platform application for Shopnexus."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.4.0
  flutter_riverpod: ^3.0.0
  # Capped by freezed, not by choice: riverpod_generator >=4.0.6 wants analyzer ^13
  # and freezed ^3 tops out at ^12, so reaching riverpod 4.0.6+ means freezed
  # 4.0.0-dev — a prerelease code generator, for nothing this app uses.
  riverpod_annotation: ^4.0.3
  retrofit: ^4.9.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^17.4.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  # `@CopyWith()` on the generated DTOs in lib/api/generated. The annotation
  # only has to resolve: copy_with_extension_gen is deliberately not wired in,
  # since generating copyWith for 240 edge DTOs buys nothing and its analyzer
  # pin collides with the other generators'.
  copy_with_extension: ^16.0.0

  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  intl: ^0.20.3
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  web_socket_channel: ^3.0.3
  shimmer: ^3.0.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0
  build_runner: ^2.4.8
  freezed: ^3.0.0
  json_serializable: ^6.7.1
  retrofit_generator: ^10.2.8
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo_shopnexus.jpg

dependency_overrides:
  meta: ^1.18.0