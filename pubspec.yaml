name: shopnexus_flutter_app
description: "Cross-platform application for Shopnexus."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.4.0
  flutter_riverpod: ^3.0.0-dev.0
  riverpod_annotation: ^3.0.0-dev.0
  retrofit: ^4.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^14.2.0
  freezed_annotation: ^3.0.0-dev.0
  json_annotation: ^4.9.0
  copy_with_extension: ^5.0.4

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  web_socket_channel: ^2.4.5
  shimmer: ^3.0.0
  webview_flutter: ^4.7.0
  fl_chart: ^0.66.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.0
  build_runner: ^2.4.8
  freezed: ^3.0.0
  json_serializable: ^6.7.1
  retrofit_generator: ^10.2.1
  riverpod_generator: ^3.0.0-dev.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo_shopnexus.jpg

dependency_overrides:
  meta: ^1.15.0